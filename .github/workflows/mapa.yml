name: Mapa de parede do Paraguai (dados)

# Gera o mosaico Sentinel-2 (época seca) e o relevo do Paraguai inteiro para o mapa A0 do escritório.
# Roda só quando o script muda ou pelo botão "Run workflow"; não interfere no NDVI.
on:
  push:
    branches: [main]
    paths: ["mapa/**"]
  workflow_dispatch:
    inputs:
      so_dem:
        description: "Só o relevo (1) — não gasta unidades do Sentinel Hub. No modo temas: etapas a refazer, separadas por vírgula"
        required: false
        default: "0"
      modo:
        description: "pais (Paraguai inteiro, 100 m) ou detalhe (recorte das fazendas, 45 m)"
        required: false
        default: "pais"
      cobertura:
        description: "1 = só a cobertura do solo de referência (Impact Observatory); temas = dados dos mapas temáticos"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: mapa
  cancel-in-progress: false

jobs:
  dados:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Baixar mosaico Sentinel-2 e relevo
        env:
          PYTHONUNBUFFERED: "1"
          OUT: out
          SO_DEM: ${{ github.event.inputs.so_dem }}
          MODO: ${{ github.event.inputs.modo || 'pais' }}
          CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
          CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}
        run: |
          case "${{ github.event.inputs.cobertura }}" in
            1) python mapa/cobertura.py ;;
            temas)
              pip install -q pyogrio
              mkdir -p out
              if git ls-remote --exit-code origin mapa-temas >/dev/null; then git fetch -q --depth 1 origin mapa-temas && git archive origin/mapa-temas | tar -x -C out; fi
              ETAPAS="${{ github.event.inputs.so_dem }}" python mapa/temas.py ;;
            *) python mapa/paraguai.py ;;
          esac
      - name: Gravar no ramo mapa-dados (ou mapa-detalhe), sem histórico
        env:
          GH_TOKEN: ${{ github.token }}
          RAMO: ${{ github.event.inputs.cobertura == 'temas' && 'mapa-temas' || format('{0}{1}', github.event.inputs.modo == 'detalhe' && 'mapa-detalhe' || 'mapa-dados', github.event.inputs.cobertura == '1' && '-cobertura' || '') }}
        run: |
          ls -la out
          cd out
          git init -q -b "$RAMO"
          git add -A
          git -c user.name=mapa-bot -c user.email=mapa-bot@users.noreply.github.com commit -qm "dados do mapa do Paraguai $(date -u +%F)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$RAMO"
